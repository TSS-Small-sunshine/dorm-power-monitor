<!doctype html>
<!-- R64 — Admin / System config page.
     * Scrape / push / admin-password sections, all in one card.
     * <dorm-stat-card> shows meta-config snapshots.
     * <dorm-toast> + <dorm-spinner> handle save feedback.
     * View Transitions via admin_config.js wrap re-renders. -->
<html lang=zh><head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=csrf-token content="{{ csrf_token() }}">
<title>系统配置 · dorm-power-monitor</title>
<link rel=stylesheet href="/static/css/admin.css">
<script src="/static/js/components/dorm-stat-card.js"></script>
<script src="/static/js/components/dorm-toast.js"></script>
<script src="/static/js/components/dorm-spinner.js"></script>
</head><body>

<nav class="admin-nav" aria-label="admin nav">
  <div class="admin-nav-inner">
    <div class="brand">
      <span class="brand-mark">⚙</span>
      <span class="brand-name">Admin</span>
      <span class="brand-user" id="admin-user-label"></span>
    </div>
    <div class="admin-tabs" role="tablist">
      <a class="admin-tab" data-tab="users" href="/admin/users">用户</a>
      <a class="admin-tab" data-tab="config" href="/admin/config">配置</a>
      <a class="admin-tab" data-tab="test" href="/admin/test">测试</a>
      <a class="admin-tab" data-tab="audit" href="/admin/audit">审计</a>
    </div>
    <div class="admin-actions">
      <a class="icon-link" href="/">← 主面板</a>
      <button class="icon-btn" id="logout-btn" type="button" title="退出登录">⎋</button>
    </div>
  </div>
</nav>

<main class="admin-main">
  <header class="admin-header">
    <h1>系统配置</h1>
    <p class="admin-sub">抓包 / 推送 / 管理员密码；改动立刻写入 meta 并审计。</p>
  </header>

  <section class="admin-section">
    <div class="stat-grid">
      <dorm-stat-card data-label="电价" data-foot="元 / kW·h">
        <div class="card-value" id="stat-eqprice">—</div>
      </dorm-stat-card>
      <dorm-stat-card data-label="日报" data-foot="开启=1 / 关闭=0">
        <div class="card-value" id="stat-daily">—</div>
      </dorm-stat-card>
      <dorm-stat-card data-label="管理员密码" data-foot="元数据 / 环境变量">
        <div class="card-value" id="stat-pwd">—</div>
      </dorm-stat-card>
    </div>
  </section>

  <section class="admin-section">
    <h2><span class=ic>🏠</span>抓包配置</h2>
    <label>学校 base URL<input id=cfg-base-url></label>
    <span class=help>宿舍门户根地址；默认即可（学校一般不会换）。</span>

    <label>openid<input id=cfg-openid></label>
    <span class=help>把学校 H5 页面 URL 里的 <code>openid=</code> 整段粘进来；视为密码。</span>

    <label>roomId<input id=cfg-room-id></label>
    <span class=help>留空让抓取脚本自动从 finduser 页面发现。已知可填加速抓取。</span>

    <label>电价 (元/kW·h)<input id=cfg-eqprice></label>
    <span class=help>用于低余额告警阈值；默认 0.5。</span>

    <label>飞书 webhook<input id=cfg-webhook></label>
    <span class=help>机器人 hook URL；签名验证另配 FEISHU_SECRET。</span>

    <div class=btn-row>
      <button id=save-scrape class="btn-primary">
        <dorm-spinner glyph="⏵" speed="900"></dorm-spinner><span>保存抓包配置</span>
      </button>
    </div>
  </section>

  <section class="admin-section">
    <h2><span class=ic>🔔</span>推送配置</h2>
    <div class=row>
      <div><label>L2 整点报</label><input id=cfg-l2 placeholder="1 / 0"></div>
      <div><label>日报</label><input id=cfg-daily placeholder="1 / 0"></div>
      <div><label>周报</label><input id=cfg-weekly placeholder="1 / 0"></div>
      <div><label>月报</label><input id=cfg-monthly placeholder="1 / 0"></div>
    </div>
    <div class=row>
      <div><label>日报时间</label><input id=cfg-daily-time placeholder="09:00"></div>
      <div><label>周报时间</label><input id=cfg-weekly-time placeholder="09:00"></div>
      <div><label>月报时间</label><input id=cfg-monthly-time placeholder="09:00"></div>
      <div></div>
    </div>
    <div class=row>
      <div><label>静默开始</label><input id=cfg-quiet-start placeholder="23:00"></div>
      <div><label>静默结束</label><input id=cfg-quiet-end placeholder="07:00"></div>
    </div>
    <div class=btn-row>
      <button id=save-push class="btn-primary">
        <dorm-spinner glyph="⏵" speed="900"></dorm-spinner><span>保存推送配置</span>
      </button>
    </div>
  </section>

  <section class="admin-section">
    <h2><span class=ic>🔐</span>管理员密码</h2>
    <label>新密码（留空不修改）<input id=cfg-admin-pwd type=password placeholder="至少 8 位"></label>
    <span class=help>写入 <code>meta.admin_password</code>。下一次登录生效。</span>
    <div class=btn-row>
      <button id=save-pwd class="btn-primary">
        <dorm-spinner glyph="⏵" speed="900"></dorm-spinner><span>保存密码</span>
      </button>
    </div>
  </section>
</main>

<div class="toast-stack" id=toast-stack aria-live=polite></div>

<script>
window.__ADMIN_CONFIG_INITIAL__ = {
  csrf_token: {{ csrf_token_value|tojson }},
  current_user: {{ (current_user.username if current_user else "")|tojson }},
  current_role: {{ (current_user.role if current_user else "")|tojson }},
  data: {{ initial_data|tojson }},
};
</script>
<script src="/static/js/admin_config.js"></script>
</body></html>
