<!doctype html>
<!-- R64 — Login page (HTML).
     * AJAX form submit so the inline error toast can render without
       a full page reload (lockout / invalid_credentials).
     * CSRF token is read from the meta tag (also planted as the
       `dorm_csrf` cookie by auth.csrf_cookie_token) and echoed back
       in the JSON body as `csrf_token`.
     * 5 failures in 15 minutes → 401 "locked"; the toast spells it
       out so the user knows to wait. -->
<html lang=zh><head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=csrf-token content="{{ csrf_token() }}">
<title>登录 · dorm-power-monitor</title>
<link rel=stylesheet href="/static/css/admin.css">
<link rel=stylesheet href="/static/css/login.css">
<script src="/static/js/components/dorm-toast.js"></script>
</head><body class="login-body">

<main class="login-main">
  <section class="login-card" aria-labelledby="login-title">
    <div class="login-mark">⚡</div>
    <h1 id=login-title>登录</h1>
    <p class="login-sub">电费助手 · 后台管理</p>

    <form id=login-form class="login-form" autocomplete="on" novalidate>
      <label>用户名
        <input id=login-username name=username
               autocomplete=username autocapitalize=none required>
      </label>
      <label>密码
        <input id=login-password name=password type=password
               autocomplete=current-password required>
      </label>
      <button id=login-submit class="btn-primary" type=submit>
        <span class="btn-text">登录</span>
      </button>
      <p class="login-hint">5 次密码错误会锁定账号 15 分钟。</p>
    </form>

    <div id=login-error class="login-error" hidden></div>

    <dorm-toast id=login-success-toast kind=success duration=2500 hidden>
      登录成功
    </dorm-toast>
  </section>
</main>

<div class="toast-stack" id=toast-stack aria-live=polite></div>

<script>
window.__LOGIN_INITIAL__ = {
  csrf_token: {{ csrf_token()|tojson }},
};
</script>
<script src="/static/js/login.js"></script>
</body></html>
