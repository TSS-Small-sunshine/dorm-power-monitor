<!doctype html>
<!-- R64 — Admin / User CRUD page.
     * Sidebar nav highlights the current section.
     * <dorm-stat-card> cards summarise user counts.
     * <dorm-toast> + <dorm-spinner> for inline action feedback.
     * window.__INITIAL_DATA__ is hydrated from server-side context.
     * View Transitions via admin_users.js wrap section swaps.
     * CSRF token comes from {{ csrf_token() }} and is mirrored as a
       meta tag so the JS fetch wrapper can echo it as X-CSRF-Token. -->
<html lang=zh><head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=csrf-token content="{{ csrf_token() }}">
<title>用户管理 · dorm-power-monitor</title>
<link rel=stylesheet href="/static/css/admin.css">
<script src="/static/js/components/dorm-stat-card.js"></script>
<script src="/static/js/components/dorm-toast.js"></script>
<script src="/static/js/components/dorm-spinner.js"></script>
</head><body>

<nav class="admin-nav" aria-label="admin nav">
  <div class="admin-nav-inner">
    <div class="brand">
      <span class="brand-mark">⚙</span>
      <span class="brand-name">Admin</span>
      <span class="brand-user" id="admin-user-label"></span>
    </div>
    <div class="admin-tabs" role="tablist">
      <a class="admin-tab" data-tab="users" href="/admin/users">用户</a>
      <a class="admin-tab" data-tab="config" href="/admin/config">配置</a>
      <a class="admin-tab" data-tab="test" href="/admin/test">测试</a>
      <a class="admin-tab" data-tab="audit" href="/admin/audit">审计</a>
    </div>
    <div class="admin-actions">
      <a class="icon-link" href="/">← 主面板</a>
      <button class="icon-btn" id="logout-btn" type="button" title="退出登录">⎋</button>
    </div>
  </div>
</nav>

<main class="admin-main">
  <header class="admin-header">
    <h1>用户管理</h1>
    <p class="admin-sub">新增 / 修改 / 删除登录账号；任何变更都会写入审计日志。</p>
  </header>

  <section class="admin-section">
    <div class="stat-grid">
      <dorm-stat-card data-label="总用户数" data-foot="包含 viewer">
        <div class="card-value" id="stat-total-users">—</div>
      </dorm-stat-card>
      <dorm-stat-card data-label="管理员" data-foot="role=admin">
        <div class="card-value" id="stat-admin-users">—</div>
      </dorm-stat-card>
      <dorm-stat-card data-label="观察者" data-foot="role=viewer">
        <div class="card-value" id="stat-viewer-users">—</div>
      </dorm-stat-card>
    </div>
  </section>

  <section class="admin-section">
    <h2><span class=ic>➕</span>新建用户</h2>
    <div class="form-row">
      <label>用户名（3-32 位）<input id=nu-username placeholder="例如：bob"></label>
      <label>密码（≥8 位）<input id=nu-password type=password placeholder="至少 8 位"></label>
      <label>角色
        <select id=nu-role>
          <option value=viewer>viewer（只读）</option>
          <option value=admin>admin（管理）</option>
        </select>
      </label>
      <button id=nu-create class="btn-primary">
        <dorm-spinner glyph="⏵" speed="900" id=nu-spinner></dorm-spinner>
        <span>创建</span>
      </button>
    </div>
    <div id=nu-error class="hint err"></div>
  </section>

  <section class="admin-section">
    <h2><span class=ic>👥</span>现有用户</h2>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr><th>ID</th><th>用户名</th><th>角色</th><th>创建时间</th><th>最近登录</th><th class=actions>操作</th></tr>
        </thead>
        <tbody id=users-tbody>
          <tr class=empty><td colspan=6>加载中…</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="admin-section" id=edit-panel hidden>
    <h2><span class=ic>✎</span>编辑用户 <span id=edit-username></span></h2>
    <div class="form-row">
      <label>新密码（留空不修改）<input id=ed-password type=password placeholder="≥8 位"></label>
      <label>角色
        <select id=ed-role>
          <option value=viewer>viewer</option>
          <option value=admin>admin</option>
        </select>
      </label>
      <button id=ed-save class="btn-primary">保存</button>
      <button id=ed-cancel class="btn-secondary">取消</button>
    </div>
  </section>
</main>

<div class="toast-stack" id=toast-stack aria-live=polite></div>

<script>
window.__ADMIN_USERS_INITIAL__ = {
  csrf_token: {{ csrf_token_value|tojson }},
  current_user: {{ (current_user.username if current_user else "")|tojson }},
  current_role: {{ (current_user.role if current_user else "")|tojson }},
};
</script>
<script src="/static/js/admin_users.js"></script>
</body></html>
