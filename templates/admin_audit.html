<!doctype html>
<!-- R64 — Admin / Audit page.
     * Paginated audit_log viewer.
     * Filter by action / user_id / since.
     * <dorm-stat-card> + <dorm-toast> + <dorm-spinner>. -->
<html lang=zh><head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=csrf-token content="{{ csrf_token() }}">
<title>审计日志 · dorm-power-monitor</title>
<link rel=stylesheet href="/static/css/admin.css">
<script src="/static/js/components/dorm-stat-card.js"></script>
<script src="/static/js/components/dorm-toast.js"></script>
<script src="/static/js/components/dorm-spinner.js"></script>
</head><body>

<nav class="admin-nav" aria-label="admin nav">
  <div class="admin-nav-inner">
    <div class="brand">
      <span class="brand-mark">⚙</span>
      <span class="brand-name">Admin</span>
      <span class="brand-user" id="admin-user-label"></span>
    </div>
    <div class="admin-tabs" role="tablist">
      <a class="admin-tab" data-tab="users" href="/admin/users">用户</a>
      <a class="admin-tab" data-tab="config" href="/admin/config">配置</a>
      <a class="admin-tab" data-tab="test" href="/admin/test">测试</a>
      <a class="admin-tab" data-tab="audit" href="/admin/audit">审计</a>
    </div>
    <div class="admin-actions">
      <a class="icon-link" href="/">← 主面板</a>
      <button class="icon-btn" id="logout-btn" type="button" title="退出登录">⎋</button>
    </div>
  </div>
</nav>

<main class="admin-main">
  <header class="admin-header">
    <h1>审计日志</h1>
    <p class="admin-sub">所有登录、用户变更、配置写入、CSRF 拒绝均会落库。</p>
  </header>

  <section class="admin-section">
    <div class="stat-grid">
      <dorm-stat-card data-label="总记录" data-foot="audit_log 行数">
        <div class="card-value" id="stat-total-rows">—</div>
      </dorm-stat-card>
      <dorm-stat-card data-label="当前页" data-foot="page / per_page">
        <div class="card-value" id="stat-page-info">—</div>
      </dorm-stat-card>
      <dorm-stat-card data-label="总页数" data-foot="ceil(total/per_page)">
        <div class="card-value" id="stat-total-pages">—</div>
      </dorm-stat-card>
    </div>
  </section>

  <section class="admin-section">
    <h2><span class=ic>🔍</span>过滤</h2>
    <div class="form-row">
      <label>action<input id=f-action placeholder="例如 user.create"></label>
      <label>user_id<input id=f-user-id placeholder="例如 1"></label>
      <label>since (YYYY-MM-DD HH:MM:SS)<input id=f-since></label>
      <label>per_page
        <select id=f-per-page>
          <option>25</option>
          <option selected>50</option>
          <option>100</option>
          <option>200</option>
        </select>
      </label>
      <button id=f-apply class="btn-primary">
        <dorm-spinner glyph="⏵" speed="900"></dorm-spinner><span>应用</span>
      </button>
    </div>
  </section>

  <section class="admin-section">
    <h2><span class=ic>📜</span>记录</h2>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr><th>时间</th><th>用户</th><th>action</th><th>target</th><th>IP</th><th>details</th></tr>
        </thead>
        <tbody id=audit-tbody>
          <tr class=empty><td colspan=6>加载中…</td></tr>
        </tbody>
      </table>
    </div>
    <div class=pager>
      <button id=pg-prev class="btn-secondary">← 上一页</button>
      <span id=pg-label>—</span>
      <button id=pg-next class="btn-secondary">下一页 →</button>
    </div>
  </section>
</main>

<div class="toast-stack" id=toast-stack aria-live=polite></div>

<script>
window.__ADMIN_AUDIT_INITIAL__ = {
  csrf_token: {{ csrf_token_value|tojson }},
  current_user: {{ (current_user.username if current_user else "")|tojson }},
  current_role: {{ (current_user.role if current_user else "")|tojson }},
};
</script>
<script src="/static/js/admin_audit.js"></script>
</body></html>
