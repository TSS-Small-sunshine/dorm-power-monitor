<!DOCTYPE html>
<!-- R51 preview v2 — Modern minimal dashboard (Linear / Vercel style) -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>预览 · 宿舍电量监控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg-page: #0a0a0b;
  --bg-card: #131316;
  --bg-elevated: #1a1a1e;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.14);
  --accent: #6366f1;
  --accent-hover: #818cf8;
  --accent-soft: rgba(99, 102, 241, 0.10);
  --text-primary: #fafafa;
  --text-secondary: #a1a1aa;
  --text-tertiary: #71717a;
  --online: #22c55e;
  --offline: #ef4444;
  --warning: #f59e0b;
  --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
  --shadow-hover: 0 4px 12px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.1);
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Cascadia Code", Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg-page);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* === Top nav ============================================== */
.topnav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(10,10,11,0.8);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.topnav-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 24px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 14px;
}
.brand-mark {
  width: 22px; height: 22px;
  border-radius: 6px;
  background: var(--accent);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}
.tabs {
  display: flex;
  gap: 4px;
  margin: 0 auto;
}
.tab {
  padding: 6px 12px;
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.tab:hover { color: var(--text-primary); background: rgba(255,255,255,0.04); }
.tab.active { color: var(--text-primary); background: var(--bg-elevated); }
.nav-actions {
  display: flex; align-items: center; gap: 8px;
}
.icon-btn {
  width: 32px; height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}
.icon-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
.refresh-btn {
  padding: 0 12px;
  height: 32px;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  border: none;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: inherit;
}
.refresh-btn:hover { background: var(--accent-hover); }

/* === Main container ===================================== */
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 24px 80px;
}
.section { display: none; }
.section.active { display: block; }

/* === Hero =============================================== */
.hero {
  padding: 32px 0 48px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 32px;
}
.hero-label {
  font-size: 12px;
  color: var(--text-tertiary);
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.hero-value {
  font-size: 64px;
  font-weight: 600;
  font-family: var(--font-mono);
  letter-spacing: -2px;
  line-height: 1;
  color: var(--text-primary);
  margin-bottom: 12px;
  font-variant-numeric: tabular-nums;
}
.hero-unit {
  font-size: 20px;
  color: var(--text-secondary);
  font-weight: 500;
  margin-left: 8px;
  font-family: var(--font-sans);
}
.hero-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--text-secondary);
}
.hero-meta .meta-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--online);
  box-shadow: 0 0 0 3px rgba(34,197,94,0.15);
}
.status-dot.offline { background: var(--offline); box-shadow: 0 0 0 3px rgba(239,68,68,0.15); }

/* === Grid ================================================ */
.grid {
  display: grid;
  gap: 16px;
}
.grid-3 {
  grid-template-columns: repeat(4, 1fr);
}

/* === Stat card ========================================== */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 18px;
}
.card-label {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 500;
  margin-bottom: 6px;
}
.card-value {
  font-size: 28px;
  font-weight: 600;
  font-family: var(--font-mono);
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.5px;
}
.card-value.is-empty { color: var(--text-tertiary); }
.card-foot {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 4px;
  font-family: var(--font-mono);
}

/* === Chart panel ========================================= */
.panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 24px;
  margin-bottom: 16px;
}
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 12px;
}
.panel-title {
  font-size: 14px;
  font-weight: 600;
  margin: 0;
  color: var(--text-primary);
}
.panel-sub {
  font-size: 12px;
  color: var(--text-secondary);
  font-family: var(--font-mono);
}
.range-group {
  display: inline-flex;
  background: var(--bg-elevated);
  border-radius: 8px;
  padding: 2px;
  gap: 1px;
}
.range-btn {
  padding: 4px 10px;
  font-size: 12px;
  color: var(--text-secondary);
  background: transparent;
  border: none;
  cursor: pointer;
  border-radius: 6px;
  font-family: inherit;
  font-weight: 500;
}
.range-btn:hover { color: var(--text-primary); }
.range-btn.active { background: var(--accent); color: #fff; }
.chart-wrap {
  position: relative;
  height: 280px;
  width: 100%;
}

/* === Filter bar ========================================== */
.filter-bar {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.filter-bar input {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-family: var(--font-mono);
  color-scheme: dark;
}
.filter-bar label {
  font-size: 12px;
  color: var(--text-secondary);
}
.btn {
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  font-family: inherit;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary {
  background: transparent;
  color: var(--text-secondary);
}
.btn-secondary:hover { color: var(--text-primary); }

/* === Table =============================================== */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.data-table th {
  text-align: left;
  padding: 8px 12px;
  font-size: 11px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 500;
  border-bottom: 1px solid var(--border);
}
.data-table th.text-end { text-align: right; }
.data-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text-primary);
}
.data-table td.text-end {
  text-align: right;
  font-family: var(--font-mono);
  font-weight: 500;
}
.data-table td.ts {
  font-family: var(--font-mono);
  color: var(--text-secondary);
  font-size: 12px;
}
.data-table tbody tr:hover { background: rgba(255,255,255,0.02); }

/* === Bottom status bar =================================== */
.status-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 36px;
  background: rgba(10,10,11,0.8);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  font-size: 11px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  gap: 16px;
}
.status-bar .spacer { flex: 1; }

/* === Mobile ============================================== */
@media (max-width: 768px) {
  .topnav-inner { padding: 10px 16px; flex-wrap: wrap; gap: 12px; }
  .tabs { order: 3; width: 100%; justify-content: center; margin: 0; }
  main { padding: 20px 16px 80px; }
  .hero { padding: 20px 0 32px; }
  .hero-value { font-size: 48px; }
  .grid-3 { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .card { padding: 14px; }
  .card-value { font-size: 22px; }
  .panel { padding: 16px; }
  .chart-wrap { height: 220px; }
}
@media (max-width: 480px) {
  .hero-value { font-size: 40px; }
  .grid-3 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <div class="brand">
      <span class="brand-mark">⚡</span>
      <span>电费助手</span>
    </div>
    <div class="tabs">
      <button class="tab active">概览</button>
      <button class="tab">历史</button>
      <button class="tab">违规</button>
      <button class="tab">电表</button>
    </div>
    <div class="nav-actions">
      <button class="icon-btn">🎨</button>
      <button class="refresh-btn">⟳ 刷新</button>
    </div>
  </div>
</nav>

<main>
  <!-- HERO -->
  <div class="hero">
    <div class="hero-label">剩余电量</div>
    <div class="hero-value">143.46<span class="hero-unit">kW·h</span></div>
    <div class="hero-meta">
      <span class="meta-item"><span class="status-dot"></span>已连接</span>
      <span class="meta-item">抄表 2026-09-17 22:48:23</span>
      <span class="meta-item">30秒前</span>
    </div>
  </div>

  <!-- CHART -->
  <div class="panel">
    <div class="panel-head">
      <h5 class="panel-title">剩余电量趋势</h5>
      <div class="range-group">
        <button class="range-btn active">24h</button>
        <button class="range-btn">3d</button>
        <button class="range-btn">7d</button>
        <button class="range-btn">30d</button>
      </div>
    </div>
    <div class="chart-wrap">
      <canvas id="chart"></canvas>
    </div>
  </div>

  <!-- STAT CARDS -->
  <div class="grid grid-3">
    <div class="card">
      <div class="card-label">本月费用</div>
      <div class="card-value">¥231.61</div>
      <div class="card-foot">@¥0.500/kW·h</div>
    </div>
    <div class="card">
      <div class="card-label">1 小时</div>
      <div class="card-value">10.04 <span style="font-size:14px;color:var(--text-secondary)">kW·h</span></div>
      <div class="card-foot">差值</div>
    </div>
    <div class="card">
      <div class="card-label">日均</div>
      <div class="card-value">29.94 <span style="font-size:14px;color:var(--text-secondary)">kW·h</span></div>
      <div class="card-foot">窗口内</div>
    </div>
    <div class="card">
      <div class="card-label">抄表</div>
      <div class="card-value" style="font-size:18px">22:48:23</div>
      <div class="card-foot">学校电表最近</div>
    </div>
  </div>
</main>

<div class="status-bar">
  <span><span class="status-dot"></span>已连接</span>
  <span>最近采集 2026-09-17 22:48:23</span>
  <span class="spacer"></span>
  <span>1-4 切换 · R 刷新</span>
</div>

<script>
// Chart.js preview
const ctx = document.getElementById('chart').getContext('2d');
const labels = ['14:26','14:53','16:50','18:00','20:50','23:50','01:00','02:33','03:30','05:10','06:50','09:10','12:00','15:00','16:40','18:50','21:00','22:15'];
const data = [186,184,184,184,182,180,180,179,178,175,166,162,160,156,154,154,152,143];

const grad = ctx.createLinearGradient(0, 0, 0, 280);
grad.addColorStop(0, 'rgba(99, 102, 241, 0.20)');
grad.addColorStop(1, 'rgba(99, 102, 241, 0.0)');

new Chart(ctx, {
  type: 'line',
  data: {
    labels: labels,
    datasets: [{
      data: data,
      borderColor: '#6366f1',
      backgroundColor: grad,
      borderWidth: 1.5,
      fill: true,
      tension: 0.3,
      pointRadius: 0,
      pointHoverRadius: 4,
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#1a1a1e',
        borderColor: 'rgba(255,255,255,0.1)',
        titleColor: '#a1a1aa',
        bodyColor: '#fafafa',
        padding: 10,
        displayColors: false,
      }
    },
    scales: {
      x: {
        grid: { display: false },
        ticks: { color: '#71717a', font: { size: 10 }, maxRotation: 0, autoSkip: true, autoSkipPadding: 20 },
        border: { color: 'rgba(255,255,255,0.05)' }
      },
      y: {
        grid: { color: 'rgba(255,255,255,0.04)' },
        ticks: { color: '#71717a', font: { size: 10 }, callback: v => v },
        border: { display: false }
      }
    }
  }
});
</script>
</body>
</html>
