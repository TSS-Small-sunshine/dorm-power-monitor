# Reverse proxy for dorm-power-monitor (Flask on 127.0.0.1:5000).
#
# Install:
#   sudo cp nginx/dorm.conf /etc/nginx/sites-available/dorm.conf
#   sudoedit /etc/nginx/sites-available/dorm.conf   # set server_name
#   sudo ln -s /etc/nginx/sites-available/dorm.conf /etc/nginx/sites-enabled/dorm.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name dorm.example.com;   # TODO: replace with your hostname.

    client_max_body_size 1m;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    access_log /var/log/nginx/dorm.access.log;
    error_log  /var/log/nginx/dorm.error.log;

    # Recommended follow-up: terminate TLS at Nginx with Let's Encrypt.
    #   sudo certbot --nginx -d dorm.example.com
    # certbot will insert the 443 listener, certificate paths, and the
    # 80 -> 443 redirect for you.  The commented block below shows the
    # same shape for reference.
    #
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/dorm.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dorm.example.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security follow-up: add HTTP Basic Auth for the dashboard.
    # Create the file first:
    #   sudo htpasswd -c /etc/nginx/.dorm-htpasswd youruser
    # then uncomment the two lines below.
    # auth_basic           "Dorm Power";
    # auth_basic_user_file /etc/nginx/.dorm-htpasswd;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_redirect     off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:5000/healthz;
        access_log off;
    }
}
