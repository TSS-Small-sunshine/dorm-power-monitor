# Reverse proxy for dorm-power-monitor (Flask on 127.0.0.1:5000).
#
# R69 — TLS termination is mandatory. Certbot provisions the certs and
#       adds the HSTS header automatically. The 80 listener only exists
#       to issue the 301 redirect to https://.
#
# Install:
#   sudo cp nginx/dorm.conf /etc/nginx/sites-available/dorm.conf
#   sudoedit /etc/nginx/sites-available/dorm.conf   # set server_name
#   sudo certbot --nginx -d school.tssplus.top      # one-shot cert + reload
#   sudo ln -s /etc/nginx/sites-available/dorm.conf /etc/nginx/sites-enabled/dorm.conf
#   sudo nginx -t && sudo systemctl reload nginx

# R69 — server_name defaults to school.tssplus.top (the production domain).
#       Replace with your hostname if deploying elsewhere.
server {
    listen 80;
    listen [::]:80;
    server_name school.tssplus.top;

    # R69 — force HTTPS in production. The :5000 backend stays on
    # 127.0.0.1 plain HTTP; TLS terminates here.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name school.tssplus.top;

    ssl_certificate     /etc/letsencrypt/live/school.tssplus.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school.tssplus.top/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    access_log /var/log/nginx/dorm.access.log;
    error_log  /var/log/nginx/dorm.error.log;

    # R69 — HSTS so browsers refuse to downgrade for the next year.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # R69 — tell Flask the original request was HTTPS so request.is_secure
        # returns True for any code that still checks it.
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_redirect     off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:5000/healthz;
        access_log off;
    }
}